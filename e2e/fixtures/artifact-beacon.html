<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>artifact beacon</title>
<!--
  GDK-1897 e2e fixture: every outbound channel an artifact could try —
  <script src>, <link rel=stylesheet>, fetch(), new Image().src — pointed
  at 127.0.0.1:1, a closed loopback port. The committed file is safe by
  itself: the artifact route's CSP must refuse each channel before any
  socket opens, and even a full CSP regression reaches only a closed port.
  The no-network test rewrites the port onto a live sink before uploading
  its own copy, so a regression is visible at the socket — the sink
  receiving nothing is the contract, not the devtools panel. 127.0.0.1 is
  the only host literal here (scripts/scan-internal.sh is a gate).
-->
<link rel="stylesheet" href="http://127.0.0.1:1/static-css">
<script src="http://127.0.0.1:1/static-js"></script>
</head>
<body>
<div id="ran">no</div>
<div id="ext">no</div>
<div id="fetch">pending</div>
<div id="img">pending</div>
<script>
document.getElementById('ran').textContent = 'yes';
fetch('http://127.0.0.1:1/fetch-beacon').then(
  function () { document.getElementById('fetch').textContent = 'LOADED (leak)'; },
  function (e) { document.getElementById('fetch').textContent = 'refused ' + e.name; }
);
var b = new Image();
b.src = 'http://127.0.0.1:1/img-beacon';
b.onload = function () { document.getElementById('img').textContent = 'LOADED (leak)'; };
b.onerror = function () { document.getElementById('img').textContent = 'refused'; };
</script>
</body>
</html>
